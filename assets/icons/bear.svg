<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- ears -->
  <circle cx="7" cy="6.5" r="2.8" fill="var(--bear-fur,#A97855)"/>
  <circle cx="17" cy="6.5" r="2.8" fill="var(--bear-fur,#A97855)"/>
  <circle cx="7" cy="6.5" r="1.3" fill="var(--bear-ear,#D9B08C)"/>
  <circle cx="17" cy="6.5" r="1.3" fill="var(--bear-ear,#D9B08C)"/>

  <!-- head -->
  <circle cx="12" cy="13" r="7.6" fill="var(--bear-fur,#A97855)"/>

  <!-- muzzle -->
  <ellipse cx="12" cy="15.2" rx="2.8" ry="2.2"
           fill="var(--bear-muzzle,#F7EFE8)"/>

  <!-- eyes -->
  <ellipse cx="9.3" cy="12.1" rx=".7" ry="1"
           fill="var(--animal-eye,#35281F)"/>
  <ellipse cx="14.7" cy="12.1" rx=".7" ry="1"
           fill="var(--animal-eye,#35281F)"/>

  <!-- nose -->
  <ellipse cx="12" cy="14.3" rx=".7" ry=".55"
           fill="var(--animal-nose,#6B4737)"/>

  <!-- mouth -->
  <path d="M11.4 15.6Q12 16.2 12.6 15.6"
        stroke="var(--animal-eye,#35281F)"
        stroke-width=".6"
        stroke-linecap="round"
        fill="none"/>

  <!-- blush -->
  <circle cx="7.9" cy="15" r=".6"
          fill="var(--animal-blush,#F5B5B5)"
          opacity=".55"/>
  <circle cx="16.1" cy="15" r=".6"
          fill="var(--animal-blush,#F5B5B5)"
          opacity=".55"/>
</svg>