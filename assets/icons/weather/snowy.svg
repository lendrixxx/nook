<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <!-- Nook weather icon: snowy -->


  <!-- cloud -->

  <path
    d="
      M16 32
      C11 32 8 36 9 41
      C10 46 15 48 21 48
      H44
      C51 48 55 44 54 39
      C53 34 48 31 43 32
      C40 24 32 21 25 24
      C21 25 18 28 16 32 Z"
