    <!-- left -->

    <line x1="19" y1="53" x2="19" y2="61"/>
    <line x1="15" y1="57" x2="23" y2="57"/>
    <line x1="16" y1="54" x2="22" y2="60"/>
    <line x1="22" y1="54" x2="16" y2="60"/>


    <!-- middle -->

    <line x1="32" y1="55" x2="32" y2="63"/>
    <line x1="28" y1="59" x2="36" y2="59"/>
    <line x1="29" y1="56" x2="35" y2="62"/>
    <line x1="35" y1="56" x2="29" y2="62"/>


    <!-- right -->

    <line x1="45" y1="53" x2="45" y2="61"/>
    <line x1="41" y1="57" x2="49" y2="57"/>
    <line x1="42" y1="54" x2="48" y2="60"/>
    <line x1="48" y1="54" x2="42" y2="60"/>

