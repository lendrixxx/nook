<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <!-- Nook weather icon: partly cloudy -->

  <!-- sun behind -->

  <circle
    cx="23"
    cy="22"
    r="11"
    fill="var(--sun,#F6C85F)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"/>


  <!-- angled sun rays -->

  <g
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round">

    <line x1="23" y1="6" x2="23" y2="3"/>
    <line x1="23" y1="38" x2="23" y2="41"/>

    <line x1="7" y1="22" x2="4" y2="22"/>
    <line x1="39" y1="22" x2="42" y2="22"/>

    <line x1="12" y1="11" x2="9" y2="8"/>
    <line x1="34" y1="11" x2="37" y2="8"/>

    <line x1="12" y1="33" x2="9" y2="36"/>
    <line x1="34" y1="33" x2="37" y2="36"/>

  </g>


  <!-- cloud -->

  <path
    d="
      M18 48
      C12 48 9 44 10 39
      C11 34 16 31 22 33
      C25 25 34 23 41 27
      C46 29 49 34 48 38
      C54 38 57 42 56 46
      C55 50 51 51 45 51
      H18 Z"
    fill="var(--cloud,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>

</svg>
