<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <!-- Nook cozy bunny: cozy (no effects) -->

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#F3C6A7" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#F3C6A7" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- ears -->

  <path
    d="M101 72 C92 48 91 18 105 12 C119 7 125 38 123 66 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <path
    d="M155 72 C164 48 165 18 151 12 C137 7 131 38 133 66 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- inner ears -->

  <path
    d="M106 61 C101 42 101 26 107 23 C113 21 117 43 117 61 Z"
    fill="var(--earfill,#F2C8C1)"/>

  <path
    d="M150 61 C155 42 155 26 149 23 C143 21 139 43 139 61 Z"
    fill="var(--earfill,#F2C8C1)"/>


  <!-- tail -->

  <circle cx="178" cy="160" r="16"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- legs -->

  <path
    d="M103 150 C102 174 101 190 104 201 C106 208 111 211 117 211 C123 211 127 207 127 200 C128 182 126 164 125 150 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <path
    d="M131 150 C130 164 128 182 129 200 C129 207 133 211 139 211 C145 211 150 208 152 201 C155 190 154 174 153 150 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <ellipse cx="116" cy="210" rx="11" ry="6"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>

  <ellipse cx="140" cy="210" rx="11" ry="6"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>


  <!-- body -->

  <path
    d="M96 124 Q103 105 128 105 Q153 105 160 124 Q166 146 165 170 Q160 197 128 201 Q96 197 91 170 Q90 146 96 124 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="20"
    ry="26"
    fill="var(--belly,#FFFDF7)"/>


  <!-- head -->

  <path
    d="M82 82 C82 63 91 47 106 43 Q128 37 150 43 C165 47 174 63 174 82 C181 110 160 128 128 130 C96 128 75 110 82 82 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- arms hugging belly -->

  <path
    d="
      M97 132
      C91 139 92 151 98 158
      C103 164 110 165 114 160
      C117 155 111 147 105 142 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"/>

  <path
    d="
      M159 132
      C165 139 164 151 158 158
      C153 164 146 165 142 160
      C139 155 145 147 151 142 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"/>


  <!-- cheeks -->

  <circle cx="97" cy="101" r="12"
    fill="url(#blush)"/>

  <circle cx="159" cy="101" r="12"
    fill="url(#blush)"/>


  <!-- cozy eyes -->

  <path
    d="M105 94 Q111 99 117 94"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>

  <path
    d="M139 94 Q145 99 151 94"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>


  <!-- nose -->

  <ellipse
    cx="128"
    cy="100"
    rx="4"
    ry="3"
    fill="var(--ink,#74553B)"/>


  <!-- cozy small smile -->

  <path
    d="
      M128 103
      V106
      Q128 110 124 108
      M128 106
      Q128 110 132 108"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


  <!-- whiskers -->

  <g
    stroke="var(--ink,#74553B)"
    stroke-width="2"
    stroke-linecap="round">

    <line x1="89" y1="101" x2="68" y2="97"/>
    <line x1="89" y1="107" x2="68" y2="111"/>

    <line x1="167" y1="101" x2="188" y2="97"/>
    <line x1="167" y1="107" x2="188" y2="111"/>

  </g>

</svg>