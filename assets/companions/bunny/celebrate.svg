      Q153 105 160 124
      Q166 146 165 170
      Q160 197 128 201
      Q96 197 91 170
      Q90 146 96 124 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="20"
    ry="26"
