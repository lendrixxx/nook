<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <!-- Nook cozy bunny: celebrate (subtle effects) -->

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#F3C6A7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F3C6A7" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- subtle celebration effects -->

  <g
    stroke="var(--accent,#E8B04A)"
    stroke-width="3"
    stroke-linecap="round">

    <path d="M55 72 L55 82 M50 77 L60 77"/>
    <path d="M201 72 L201 82 M196 77 L206 77"/>

  </g>

  <g fill="var(--accent,#E8B04A)">
    <circle cx="70" cy="60" r="2.5"/>
    <circle cx="186" cy="60" r="2.5"/>
  </g>


  <!-- ears -->

  <path
    d="
      M101 72
      C92 48 91 18 105 12
      C119 7 125 38 123 66 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>

  <path
    d="
      M155 72
      C164 48 165 18 151 12
      C137 7 131 38 133 66 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- inner ears -->

  <path
    d="
      M106 61
      C101 42 101 26 107 23
      C113 21 117 43 117 61 Z"
    fill="var(--earfill,#F2C8C1)"/>

  <path
    d="
      M150 61
      C155 42 155 26 149 23
      C143 21 139 43 139 61 Z"
    fill="var(--earfill,#F2C8C1)"/>


  <!-- tail -->

  <circle cx="178" cy="160" r="16"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- legs -->

  <path
    d="
      M103 150
      C102 174 101 190 104 201
      C106 208 111 211 117 211
      C123 211 127 207 127 200
      C128 182 126 164 125 150 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <path
    d="
      M131 150
      C130 164 128 182 129 200
      C129 207 133 211 139 211
      C145 211 150 208 152 201
      C155 190 154 174 153 150 Z"
