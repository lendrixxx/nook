  <!-- raised arms -->

  <path
    d="
      M97 132
      C87 125 80 112 78 96
      C77 89 82 85 87 89
      C94 96 101 111 104 124
      C106 130 102 134 97 132 Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
