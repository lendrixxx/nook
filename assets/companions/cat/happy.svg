    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- integrated ears -->

  <path
    d="
      M92 55
      C95 42 103 39 111 52
      L116 59
      Q103 55 92 55
      Z"
    fill="var(--earfill,#F6D9C7)"/>

  <path
    d="
      M164 55
      C161 42 153 39 145 52
      L140 59
      Q153 55 164 55
      Z"
    fill="var(--earfill,#F6D9C7)"/>


  <!-- cheeks -->

  <circle cx="97" cy="101" r="12" fill="url(#blush)"/>
  <circle cx="159" cy="101" r="12" fill="url(#blush)"/>


  <!-- happy eyes -->

  <path
    d="M104 92 Q111 99 118 92"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>

  <path
    d="M138 92 Q145 99 152 92"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>


  <!-- nose -->

  <ellipse
    cx="128"
    cy="101"
    rx="3"
    ry="2.5"
    fill="var(--ink,#74553B)"/>


  <!-- happy anchor mouth -->

  <path
    d="
      M128 103
      v8

      M128 111
      C123 111 120 108 118 106

      M128 111
      C133 111 136 108 138 106"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>


  <!-- whiskers -->

  <g
    stroke="var(--ink,#74553B)"
    stroke-width="2"
    stroke-linecap="round">

    <line x1="88" y1="101" x2="68" y2="97"/>
    <line x1="89" y1="107" x2="69" y2="111"/>

    <line x1="168" y1="101" x2="188" y2="97"/>
    <line x1="167" y1="107" x2="187" y2="111"/>

  </g>

</svg>