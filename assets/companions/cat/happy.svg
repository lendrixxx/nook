<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="var(--cheek,#F3C6A7)" stop-opacity=".55"/>
      <stop offset="100%" stop-color="var(--cheek,#F3C6A7)" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- tail -->

  <path
    d="
      M180 148
      C220 140 232 178 211 199
      C193 216 169 207 170 186"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="13"
    stroke-linecap="round"/>


  <!-- legs -->

  <g id="legs">

    <path
      d="
        M103 160
        C102 174 101 190 104 201
        C106 208 111 211 117 211
        C123 211 127 207 127 200
        C128 188 126 174 125 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>

    <path
      d="
        M131 160
        C130 174 128 188 129 200
        C129 207 133 211 139 211
        C145 211 150 208 152 201
        C155 190 154 174 153 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>

    <ellipse
      cx="116"
      cy="210"
      rx="11"
      ry="6"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3"/>

    <ellipse
      cx="140"
      cy="210"
      rx="11"
      ry="6"
