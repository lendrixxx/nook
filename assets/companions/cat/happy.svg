  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="19"
    ry="25"
    fill="var(--belly,#FFFDF7)"/>


  <!-- arms -->

  <g id="arms">

    <path
      d="
        M96 132
        C87 138 83 151 86 162
        C89 170 95 174 101 171
        C105 169 107 164 106 158
        C105 149 102 140 96 132
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3.5"
