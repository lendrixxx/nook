<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="var(--cheek,#F3C6A7)" stop-opacity=".55"/>
      <stop offset="100%" stop-color="var(--cheek,#F3C6A7)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tail -->
  <path
    d="M180 148 C220 140 232 178 211 199 C193 216 169 207 170 186"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="13"
    stroke-linecap="round"/>

  <!-- legs walk 1 -->
  <g class="legs" id="legs">

    <g class="leg leg-left legs">
      <path
      d="
        M103 160
        C100 175 96 191 99 201
        C101 208 107 211 113 211
        C119 211 123 207 123 200
        C124 187 125 174 125 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>
      <ellipse
      cx="108"
      cy="210"
      rx="11"
      ry="6"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3"/>
    </g>
    <g class="leg leg-right legs">
      <path
      d="
        M132 160
        C136 176 143 190 151 198
        C155 203 160 202 164 198
        C168 194 166 189 161 184
        C153 174 151 166 153 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>
      <ellipse
      cx="159"
      cy="197"
      rx="11"
      ry="6"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3"/>
    </g>

  </g>


  <!-- body -->

  <path
    d="
      M96 124
      Q103 105 128 105
      Q153 105 160 124
      Q166 146 165 170
      Q160 197 128 201
      Q96 197 91 170
      Q90 146 96 124
      Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <ellipse
    cx="128"
    cy="161"
    rx="19"
    ry="25"
    fill="var(--belly,#FFFDF7)"/>


  <!-- arms -->
  <g id="arms">

    <path
      d="M96 132 C87 138 83 151 86 162 C89 170 95 174 101 171 C105 169 107 164 106 158 C105 149 102 140 96 132 Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3.5"
      stroke-linejoin="round"/>

    <path
      d="M160 132 C169 138 173 151 170 162 C167 170 161 174 155 171 C151 169 149 164 150 158 C151 149 154 140 160 132 Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3.5"
      stroke-linejoin="round"/>

  </g>


  <!-- head -->

  <path
    d="
      M77 82
      C77 68 80 55 87 47
      C93 39 101 37 108 43
      L116 51
      Q128 43 140 51
      L148 43
      C155 37 163 39 169 47
      C176 55 179 68 179 82
      C186 112 163 129 128 131
      C93 129 70 112 77 82
      Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- ears -->

  <path d="M92 55 C95 42 103 39 111 52 L116 59 Q103 55 92 55 Z"
    fill="var(--earfill,#F6D9C7)"/>

  <path d="M164 55 C161 42 153 39 145 52 L140 59 Q153 55 164 55 Z"
    fill="var(--earfill,#F6D9C7)"/>


  <!-- face -->

  <circle cx="97" cy="101" r="12" fill="url(#blush)"/>
  <circle cx="159" cy="101" r="12" fill="url(#blush)"/>

  <ellipse cx="111" cy="92" rx="4" ry="6"
    fill="var(--ink,#74553B)"/>

  <ellipse cx="145" cy="92" rx="4" ry="6"
    fill="var(--ink,#74553B)"/>

  <ellipse cx="128" cy="101" rx="3" ry="2.5"
    fill="var(--ink,#74553B)"/>

  <path d="M128 103 v5"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <g stroke="var(--ink,#74553B)" stroke-width="2" stroke-linecap="round">
    <line x1="88" y1="101" x2="68" y2="97"/>
    <line x1="89" y1="107" x2="69" y2="111"/>
    <line x1="168" y1="101" x2="188" y2="97"/>
    <line x1="167" y1="107" x2="187" y2="111"/>
  </g>

</svg>