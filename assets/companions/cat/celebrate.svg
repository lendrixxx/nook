<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="var(--cheek,#F3C6A7)" stop-opacity=".55"/>
      <stop offset="100%" stop-color="var(--cheek,#F3C6A7)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tail -->

  <path
    d="
      M180 148
      C220 140 232 178 211 199
      C193 216 169 207 170 186"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="13"
    stroke-linecap="round"/>


  <!-- legs -->

  <g id="legs">

    <path
      d="
        M103 160
        C102 174 101 190 104 201
        C106 208 111 211 117 211
        C123 211 127 207 127 200
        C128 188 126 174 125 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>

    <path
      d="
        M131 160
        C130 174 128 188 129 200
        C129 207 133 211 139 211
        C145 211 150 208 152 201
        C155 190 154 174 153 160
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="4"/>

    <ellipse
      cx="116"
      cy="210"
      rx="11"
      ry="6"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3"/>

    <ellipse
      cx="140"
      cy="210"
      rx="11"
      ry="6"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3"/>

  </g>


  <!-- body -->

  <path
    d="
      M96 124
      Q103 105 128 105
      Q153 105 160 124
      Q166 146 165 170
      Q160 197 128 201
      Q96 197 91 170
      Q90 146 96 124
      Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="19"
    ry="25"
    fill="var(--belly,#FFFDF7)"/>


  <!-- celebrate arms -->

  <g id="arms">

    <!-- left arm -->

    <path
      d="
        M99 141
        C87 139 76 132 71 121
        C69 115 72 111 78 113
        C91 117 100 127 106 136
        C109 141 105 144 99 141
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3.5"
      stroke-linejoin="round"/>


    <!-- right arm -->

    <path
      d="
        M157 141
        C169 139 180 132 185 121
        C187 115 184 111 178 113
        C165 117 156 127 150 136
        C147 141 151 144 157 141
        Z"
      fill="var(--body,#FFF7EA)"
      stroke="var(--ink,#74553B)"
      stroke-width="3.5"
      stroke-linejoin="round"/>

  </g>


  <!-- head -->

  <path
    d="
      M77 82
      C77 68 80 55 87 47
      C93 39 101 37 108 43
      L116 51
      Q128 43 140 51
      L148 43
      C155 37 163 39 169 47
      C176 55 179 68 179 82
      C186 112 163 129 128 131
      C93 129 70 112 77 82
      Z"
    fill="var(--body,#FFF7EA)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- ears -->

  <path
    d="
      M92 55
      C95 42 103 39 111 52
      L116 59
      Q103 55 92 55
      Z"
    fill="var(--earfill,#F6D9C7)"/>

  <path
    d="
      M164 55
      C161 42 153 39 145 52
      L140 59
      Q153 55 164 55
      Z"
    fill="var(--earfill,#F6D9C7)"/>


  <!-- cheeks -->

  <circle cx="97" cy="101" r="12" fill="url(#blush)"/>
  <circle cx="159" cy="101" r="12" fill="url(#blush)"/>


  <!-- celebrate eyes -->

  <circle cx="111" cy="92" r="6" fill="var(--ink,#74553B)"/>
  <circle cx="145" cy="92" r="6" fill="var(--ink,#74553B)"/>

  <circle cx="109" cy="90" r="2" fill="var(--body,#FFF7EA)"/>
  <circle cx="143" cy="90" r="2" fill="var(--body,#FFF7EA)"/>


  <!-- nose -->

  <ellipse
    cx="128"
    cy="101"
    rx="3"
    ry="2.5"
    fill="var(--ink,#74553B)"/>


  <!-- happy mouth -->

  <path
    d="
      M128 103
      v5
      C122 108 119 107 117 107
      C120 117 136 117 139 107
      C137 107 134 108 128 108"
    fill="var(--ink,#74553B)"
    stroke="var(--ink,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- whiskers -->

  <g
    stroke="var(--ink,#74553B)"
    stroke-width="2"
    stroke-linecap="round">

    <line x1="88" y1="101" x2="68" y2="97"/>
    <line x1="89" y1="107" x2="69" y2="111"/>

    <line x1="168" y1="101" x2="188" y2="97"/>
    <line x1="167" y1="107" x2="187" y2="111"/>

  </g>


  <!-- celebration marks -->

  <g
    stroke="var(--accent,#E7B45A)"
    stroke-width="3"
    stroke-linecap="round">

    <path d="M82 50 l-8 -10"/>
    <path d="M174 50 l8 -10"/>
    <path d="M128 35 v-12"/>

  </g>

</svg>