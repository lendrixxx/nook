<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <!-- Nook cozy bear: celebrate (wider arms) -->

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#F3C6A7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F3C6A7" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- ears -->

  <circle cx="92" cy="60" r="21"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <circle cx="164" cy="60" r="21"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <circle cx="92" cy="60" r="10"
    fill="var(--earfill,#E9B89A)"/>

  <circle cx="164" cy="60" r="10"
    fill="var(--earfill,#E9B89A)"/>


  <!-- tail -->

  <circle cx="171" cy="162" r="15"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- legs -->

  <g class="leg leg-left legs">
      <path
    d="M103 150
       C102 174 101 190 104 201
       C106 208 111 211 117 211
       C123 211 127 207 127 200
       C128 182 126 164 125 150 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>
      <ellipse cx="116" cy="210" rx="11" ry="6"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>
    </g>
    <g class="leg leg-right legs">
      <path
    d="M131 150
       C130 164 128 182 129 200
       C129 207 133 211 139 211
       C145 211 150 208 152 201
       C155 190 154 174 153 150 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>
      <ellipse cx="140" cy="210" rx="11" ry="6"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>
    </g>


  <!-- body -->

  <path
    d="M96 124
       Q103 105 128 105
       Q153 105 160 124
       Q166 146 165 170
       Q160 197 128 201
       Q96 197 91 170
       Q90 146 96 124 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="20"
    ry="26"
    fill="var(--belly,#EED2B4)"/>


  <!-- head -->

  <path
    d="M77 82
       C77 62 88 45 105 42
       Q128 35 151 42
       C168 45 179 62 179 82
       C186 112 163 131 128 131
       C93 131 70 112 77 82 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- wide celebration arms -->

  <path
    d="
      M98 132
      C87 128 74 119 66 108
      C62 102 65 96 71 96
      C80 96 92 108 101 120
      C105 126 104 131 98 132
      Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>

  <path
    d="
      M158 132
      C169 128 182 119 190 108
      C194 102 191 96 185 96
      C176 96 164 108 155 120
      C151 126 152 131 158 132
      Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- muzzle -->

  <ellipse
    cx="128"
    cy="103"
    rx="18"
    ry="14"
    fill="var(--muzzle,#F4D8B8)"/>


  <!-- cheeks -->

  <circle cx="97" cy="101" r="12"
    fill="url(#blush)"/>

  <circle cx="159" cy="101" r="12"
    fill="url(#blush)"/>


  <!-- excited eyes -->

  <path
    d="M105 94 Q111 87 117 94"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>

  <path
    d="M139 94 Q145 87 151 94"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linecap="round"/>


  <!-- nose -->

  <ellipse
    cx="128"
    cy="99"
    rx="5"
    ry="4"
    fill="var(--ink,#74553B)"/>


  <!-- happy open mouth -->

  <path
    d="
      M128 103
      V108
      Q120 108 120 113
      Q128 121 136 113
      Q136 108 128 108"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>


  <!-- celebration sparkles -->

  <path
    d="M66 74 L66 84 M61 79 L71 79"
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>

  <path
    d="M190 74 L190 84 M185 79 L195 79"
    stroke="var(--ink,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


</svg>