<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256">

  <!-- Nook cozy bear: walk 2 (opposite leg) -->

  <defs>
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#F3C6A7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F3C6A7" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <!-- ears -->

  <circle cx="92" cy="60" r="21"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <circle cx="164" cy="60" r="21"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <circle cx="92" cy="60" r="10"
    fill="var(--earfill,#E9B89A)"/>

  <circle cx="164" cy="60" r="10"
    fill="var(--earfill,#E9B89A)"/>


  <!-- tail closer -->

  <circle cx="171" cy="162" r="15"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- legs: left leg forward (opposite of walk 1) -->

  <path
    d="
      M103 150
      C101 168 103 184 99 197
      C97 204 101 209 107 211
      C113 213 119 209 121 202
      C125 185 126 164 125 150 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>

  <path
    d="
      M131 150
      C132 164 130 183 127 198
      C126 205 130 210 136 211
      C142 212 147 207 149 201
      C153 187 156 169 153 150 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <ellipse cx="111" cy="209" rx="11" ry="6"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>

  <ellipse cx="141" cy="210" rx="11" ry="6"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3"/>


  <!-- body -->

  <path
    d="
      M96 124
      Q103 105 128 105
      Q153 105 160 124
      Q166 146 165 170
      Q160 197 128 201
      Q96 197 91 170
      Q90 146 96 124 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"/>


  <!-- belly -->

  <ellipse
    cx="128"
    cy="161"
    rx="20"
    ry="26"
    fill="var(--belly,#EED2B4)"/>


  <!-- head -->

  <path
    d="
      M77 82
      C77 62 88 45 105 42
      Q128 35 151 42
      C168 45 179 62 179 82
      C186 112 163 131 128 131
      C93 131 70 112 77 82 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="4"
    stroke-linejoin="round"/>


  <!-- arms swinging opposite -->

  <path
    d="
      M97 132
      C88 136 85 146 87 155
      C89 163 95 166 100 162
      C105 158 107 144 97 132 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"/>

  <path
    d="
      M159 132
      C168 140 169 152 164 159
      C160 165 154 162 152 156
      C150 149 153 138 159 132 Z"
    fill="var(--body,#C98F62)"
    stroke="var(--ink,#74553B)"
    stroke-width="3.5"/>


  <!-- muzzle -->

  <ellipse
    cx="128"
    cy="103"
    rx="18"
    ry="14"
    fill="var(--muzzle,#F4D8B8)"/>


  <!-- cheeks -->

  <circle cx="97" cy="101" r="12"
    fill="url(#blush)"/>

  <circle cx="159" cy="101" r="12"
    fill="url(#blush)"/>


  <!-- eyes -->

  <ellipse cx="111" cy="93" rx="4" ry="5"
    fill="var(--ink,#74553B)"/>

  <ellipse cx="145" cy="93" rx="4" ry="5"
    fill="var(--ink,#74553B)"/>


  <!-- nose -->

  <ellipse
    cx="128"
    cy="99"
    rx="5"
    ry="4"
    fill="var(--ink,#74553B)"/>


  <!-- tiny smile -->

  <path
    d="
      M128 103
      V107
      Q124 111 120 107
      M128 107
      Q132 111 136 107"
    fill="none"
    stroke="var(--ink,#74553B)"
    stroke-width="2.8"
    stroke-linecap="round"/>


</svg>