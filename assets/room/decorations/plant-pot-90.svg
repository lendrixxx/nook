<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-12 -22 24 30" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: plant-pot
       Part of a 4-file rotation set — see plant-pot-0.svg's header comment.
       added for consistency now that Rotate is available generally.
       All 4 files are IDENTICAL: the pot body is round and its
       "left face" shading represents fixed world-space lighting, not
       something that turns with the object. The leaves are an
       already-bushy, roughly all-around arrangement rather than a
       single directional frond, so there's no clearly-different
       "other side" to draw. Small cozy potted plant.
       Leaves carry data-role attributes for live recoloring. -->


  <!-- pot body -->

  <path
    d="
      M-7 -5
      L0 -2
      L7 -5
      L6 5
      L0 8
      L-6 5
      Z"
    fill="var(--room-pot,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- pot left face -->

  <path
    d="
      M-7 -5
      L0 -2
      L0 8
      L-6 5
      Z"
    fill="var(--room-pot-lo,#B96F55)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- pot top rim -->

  <path
    d="
      M-7 -5
      L0 -9
      L7 -5
      L0 -2
      Z"
    fill="var(--room-pot-hi,#F0B98A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- left leaning leaf -->

  <path
    data-role="leaf-a"
    d="
      M-1 -6
      C-8 -12 -9 -19 -4 -20
      C1 -19 3 -12 0 -7
      Z"
    fill="var(--room-leaf-a,#8DBB72)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- right leaf -->

  <path
    data-role="leaf-b"
    d="
      M0 -7
      C2 -15 8 -18 9 -13
      C9 -8 4 -5 0 -6
      Z"
    fill="var(--room-leaf-b,#6FA65B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- front leaf -->

  <path
    data-role="leaf-a"
    d="
      M-1 -5
      C-6 -9 -7 -13 -4 -14
      C0 -13 2 -8 0 -5
      Z"
    fill="var(--room-leaf-a,#8DBB72)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>

</svg>
