<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-8 -7 16 18" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: stool
       Part of a 4-file rotation set (stool-0/90/180/270.svg), added
       for consistency with every other catalog item now that Rotate
       is available generally. All 4 files are IDENTICAL: the stool
       only ever draws its two nearest legs (the far two are implied,
       hidden behind the round seat), and the seat itself has no
       front/back distinction — there's no genuinely different view to
       draw at any of the 4 angles. Small cozy wooden stool. -->


  <!-- left leg -->

  <polygon
    points="
      -4,2
      0,4
      0,8
      -4,6"
    fill="var(--room-wood-lo,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- right leg -->

  <polygon
    points="
      4,2
      0,4
      0,8
      4,6"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- lower seat -->

  <path
    d="
      M0 -4
      L6 -1
      L6 0.5
      L0 3.5
      L-6 0.5
      L-6 -1
      Z"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- seat front edge -->

  <path
    d="
      M-6 0.5
      Q0 3.5 6 0.5"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.5"
    stroke-linecap="round"/>

</svg>
