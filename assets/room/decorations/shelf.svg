<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-10.0 -10.0 55.4 44.2">

  <!-- Nook room decoration asset: shelf
       Floating wall shelf.
       Authored at local grid origin (0,0,0); runtime positions this
       with translate to iso(worldGX, worldGY, worldGZ).
       Colors use room design tokens with cozy defaults. -->


  <!-- underside -->

  <polygon
    points="
      -9.6,4.8
      35.4,27.3
      45.0,22.5
      0.0,-0.1"
    fill="var(--room-wood-lo,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- front edge -->

  <polygon
    points="
      -9.6,4.8
      35.4,27.3
      35.4,24.2
      -9.6,1.7"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- right edge -->

  <polygon
    points="
      45.0,22.5
      35.4,27.3
      35.4,24.2
      45.0,19.4"
    fill="var(--room-wood-lo,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- top surface -->

  <polygon
    points="
      0.0,-3.1
      45.0,19.4
      35.4,24.2
      -9.6,1.7"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>

</svg>