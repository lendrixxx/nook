<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: mug, rotation 90
       Part of a 4-file rotation set — see mug-0.svg's header comment.
       Body/rim/coffee/highlight unchanged. Handle mirrored across
       x=29 (the mug's own center) from the rotation-0 file. -->


  <!-- handle behind -->

  <path
    d="
      M19 28
      C10 26 6 30 8 36
      C9 41 14 43 19 40
      L19 36
      C15 38 12 37 12 33
      C12 30 15 31 19 32
      Z"
    fill="var(--room-mug-accent,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- rounded mug body -->

  <path
    d="
      M18 25
      Q29 21 40 25
      V40
      C40 47 35 50 29 50
      C23 50 18 47 18 40
      Z"
    fill="var(--room-mug,#FFF7EA)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- rim -->

  <ellipse
    cx="29"
    cy="25"
    rx="11"
    ry="4"
    fill="var(--room-mug-hi,#FFF7EA)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"/>


  <!-- coffee -->

  <ellipse
    cx="29"
    cy="25"
    rx="7"
    ry="2.2"
    fill="var(--room-coffee,#8B5E3C)"/>


  <!-- subtle highlight -->

  <path
    d="
      M22 32
      V39"
    fill="none"
    stroke="var(--room-highlight,#FFFFFF)"
    stroke-width="2"
    stroke-linecap="round"/>

</svg>
