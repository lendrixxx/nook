<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-10.0 -10.0 23.6 26.4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: book, rotation 0
       Part of a 4-file rotation set (book-0/90/180/270.svg). Pages,
       cover faces, and top cover are unchanged across all 4 — they
       form the book's outer silhouette from this fixed camera angle
       and stay put regardless of rotation. Only the bookmark (the one
       asymmetric detail) moves: mirrored to the opposite edge at 90°,
       hidden (tucked toward the spine, out of view from this angle) at
       180°/270° — same "visible near edges, hidden far edges"
       convention as the desk drawer and mug handle. -->


  <!-- lower book pages -->

  <polygon points="-7.2,3.6 3.6,9.0 10.8,5.4 0.0,-0.8"
    fill="var(--room-paper,#FFF4DD)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- left cover face -->

  <polygon points="-7.2,3.6 3.6,9.0 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-lo,#B96F55)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- right cover face -->

  <polygon points="10.8,5.4 3.6,9.0 3.6,6.4 10.8,2.8"
    fill="var(--room-book-side,#C77A60)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- top cover -->

  <polygon points="0.0,-2.6 10.8,2.8 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-hi,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- bookmark -->

  <polygon points="2.8,-1.2 3.8,-0.7 3.8,3.0 3.3,2.3 2.8,3.0"
    fill="var(--room-accent,#F6C85F)"/>


</svg>
