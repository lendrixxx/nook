<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: mug, rotation 0
       Part of a 4-file rotation set (mug-0/90/180/270.svg). Body, rim,
       coffee, and highlight are unchanged across all 4 — they're
       already symmetric about the mug's own center (x=29) and the
       highlight represents fixed world-space lighting, not something
       that turns with the object. Only the handle (the one genuinely
       asymmetric feature) moves per rotation: right here, mirrored to
       left at 90°, hidden behind the body at 180°/270° — same
       "two visible sides, two hidden" convention as the desk drawer. -->


  <!-- handle behind -->

  <path
    d="
      M39 28
      C48 26 52 30 50 36
      C49 41 44 43 39 40
      L39 36
      C43 38 46 37 46 33
      C46 30 43 31 39 32
      Z"
    fill="var(--room-mug-accent,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- rounded mug body -->

  <path
    d="
      M18 25
      Q29 21 40 25
      V40
      C40 47 35 50 29 50
      C23 50 18 47 18 40
      Z"
    fill="var(--room-mug,#FFF7EA)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- rim -->

  <ellipse
    cx="29"
    cy="25"
    rx="11"
    ry="4"
    fill="var(--room-mug-hi,#FFF7EA)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"/>


  <!-- coffee -->

  <ellipse
    cx="29"
    cy="25"
    rx="7"
    ry="2.2"
    fill="var(--room-coffee,#8B5E3C)"/>


  <!-- subtle highlight -->

  <path
    d="
      M22 32
      V39"
    fill="none"
    stroke="var(--room-highlight,#FFFFFF)"
    stroke-width="2"
    stroke-linecap="round"/>

</svg>
