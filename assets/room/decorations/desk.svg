<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <!-- Nook room decoration asset: desk
       Small wooden desk prop.
       Colors use room design tokens with cozy defaults. -->


  <!-- back legs (behind tabletop) -->

  <path
    d="
      M23 31
      L27 33
      V52
      L23 50
      Z"
    fill="var(--room-wood-dark,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <path
    d="
      M37 33
      L41 31
      V50
      L37 52
      Z"
    fill="var(--room-wood-dark,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- tabletop -->

  <path
    d="
      M8 23
      L32 13
      L56 23
      L32 34
      Z"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- tabletop thickness -->

  <path
    d="
      M8 23
      L32 34
      L56 23
      V27
      L32 38
      L8 27
