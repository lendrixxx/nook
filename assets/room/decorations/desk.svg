    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- front legs -->

  <path
    d="
      M12 27
      L16 29
      V49
      L12 47
      Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <path
    d="
      M48 29
      L52 27
      V47
      L48 49
      Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- drawer -->

  <path
    d="
      M27 35
      L32 37
      L37 35
      V40
      L32 42
      L27 40
      Z"
    fill="var(--room-wood-hi,#E3B27B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2.5"
    stroke-linejoin="round"/>


  <!-- drawer knob -->

  <circle
    cx="32"
    cy="38"
