<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-4 0 54 46">

  <!-- Nook room decoration asset: desk (grid-precise rebuild v2)
       Authored to exactly match room.js's iso(gx,gy,gz) formula
       (x=(gx-gy)*30, y=(gx+gy)*15-gz*26). Footprint: 0.8 x 0.8 grid
       units (square), tabletop height 0.58 grid units.
       Anchor (grid 0,0,0 — the back floor corner) = SVG point (22,18).
       Draw order matters: all 4 legs first, then tabletop + thickness
       (which occlude the legs' inset tops), then the drawer/knob on
       top of the now-topmost thickness face. -->


  <!-- back leg (mostly hidden behind tabletop) -->
  <path
    d="M20.0 4.5 L24.0 6.5 L24.0 21.6 L20.0 19.6 Z"
    fill="var(--room-wood-dark,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- left leg -->
  <path
    d="M1.3 13.9 L5.3 15.9 L5.3 31.0 L1.3 29.0 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- right leg -->
  <path
    d="M38.7 13.9 L42.7 15.9 L42.7 31.0 L38.7 29.0 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- front leg -->
  <path
    d="M20.0 23.3 L24.0 25.3 L24.0 40.4 L20.0 38.4 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- tabletop -->
  <path
    d="M22.0 2.9 L46.0 14.9 L22.0 26.9 L-2.0 14.9 Z"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>

  <!-- tabletop thickness (visible underside of the front two edges) -->
  <path
    d="M-2.0 14.9 L22.0 26.9 L46.0 14.9 L46.0 18.9 L22.0 30.9 L-2.0 18.9 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- drawer, set into the front-right thickness face -->
  <path
    d="M39.3 18.3 L28.7 23.5 L28.7 27.5 L39.3 22.3 Z"
    fill="var(--room-wood-hi,#E3B27B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <circle
    cx="34.0"
    cy="21.5"
    r="1"
    fill="var(--room-metal,#74553B)"/>

</svg>
