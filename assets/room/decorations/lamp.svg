<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <!-- Nook room decoration asset: desk lamp
       Small cozy lamp prop.
       Colors use room design tokens with cozy defaults. -->


  <!-- stem -->

  <path
    d="
      M32 39
      V25"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


  <!-- lampshade: narrow top, wide bottom -->

  <path
    d="
      M28 13
      Q32 11 36 13
      L44 29
      Q32 35 20 29
      Z"
    fill="var(--room-lamp,#F6C85F)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- shade opening -->

  <path
    d="
      M20 29
      Q32 35 44 29"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


  <!-- base -->

  <path
    d="
      M23 41
      Q32 37 41 41
      V46
      Q32 50 23 46
      Z"
    fill="var(--room-wood-hi,#C98B5B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

</svg>