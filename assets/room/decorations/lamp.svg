<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.0 -65.0 52.0 88.0">
  <!-- Nook room decoration asset: lamp
       Desk lamp, flat screen-space art. Default anchor: desk top, back-left corner.
       Authored at local grid origin (0,0,0); the runtime positions this
       with a translate to iso(worldGX, worldGY, worldGZ). Colors use the
       room design tokens (see index.html :root) so themes can recolor
       every decoration without editing this file. -->
  <ellipse cx="0" cy="0" rx="16" ry="13" fill="var(--room-lamp-dark)" stroke="var(--room-outline)" stroke-width="2"/><rect x="-3" y="-34" width="6" height="34" rx="3" fill="var(--room-lamp-dark)" stroke="var(--room-outline)" stroke-width="1.5"/><path d="M-16 -29 Q0 -55 16 -29 Z" fill="var(--room-lamp)" stroke="var(--room-outline)" stroke-width="2.2" stroke-linejoin="round"/><ellipse cx="0" cy="-29" rx="16" ry="4.5" fill="var(--room-lamp-dark)"/>
</svg>
