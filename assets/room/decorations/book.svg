<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-10.0 -10.0 23.6 26.4">

  <!-- Nook room decoration asset: book
       Small closed book accent
       Authored at local grid origin (0,0,0); runtime positions this
       with translate to iso(worldGX, worldGY, worldGZ).
       Colors use room design tokens with cozy defaults. -->


  <!-- lower book pages -->

  <polygon
    points="-7.2,3.6 3.6,9.0 10.8,5.4 0.0,-0.8"
    fill="var(--room-paper,#FFF4DD)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- left cover face -->

  <polygon
    points="-7.2,3.6 3.6,9.0 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-lo,#B96F55)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- right cover face -->

  <polygon
    points="10.8,5.4 3.6,9.0 3.6,6.4 10.8,2.8"
    fill="var(--room-book-side,#C77A60)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- top cover -->

  <polygon
    points="0.0,-2.6 10.8,2.8 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-hi,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- bookmark -->

  <polygon
    points="2.8,-1.2 3.8,-0.7 3.8,3.0 3.3,2.3 2.8,3.0"
    fill="var(--room-accent,#F6C85F)"/>


</svg>
