<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-4 0 54 46">

  <!-- Nook room decoration asset: desk, rotation 90
       Part of a 4-file rotation set — see desk-0.svg's header comment.
       Legs + tabletop are UNCHANGED from rotation 0: the desk's
       footprint is a symmetric square, so from this fixed iso camera
       the silhouette looks identical at every 90° step — only the
       drawer (the one asymmetric detail) actually moves.
       The drawer + knob below are mirrored across x=22 (the shared
       front-corner vertex) onto the front-LEFT thickness face, which
       is what "turning the desk a quarter turn" actually looks like
       from this angle. -->


  <!-- back leg (mostly hidden behind tabletop) -->
  <path
    d="M20.0 4.5 L24.0 6.5 L24.0 21.6 L20.0 19.6 Z"
    fill="var(--room-wood-dark,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- left leg -->
  <path
    d="M1.3 13.9 L5.3 15.9 L5.3 31.0 L1.3 29.0 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- right leg -->
  <path
    d="M38.7 13.9 L42.7 15.9 L42.7 31.0 L38.7 29.0 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- front leg -->
  <path
    d="M20.0 23.3 L24.0 25.3 L24.0 40.4 L20.0 38.4 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- tabletop -->
  <path
    d="M22.0 2.9 L46.0 14.9 L22.0 26.9 L-2.0 14.9 Z"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>

  <!-- tabletop thickness (visible underside of the front two edges) -->
  <path
    d="M-2.0 14.9 L22.0 26.9 L46.0 14.9 L46.0 18.9 L22.0 30.9 L-2.0 18.9 Z"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>


  <!-- drawer, set into the front-LEFT thickness face (mirror of
       rotation 0's front-right drawer across x=22) -->
  <path
    d="M4.7 18.3 L15.3 23.5 L15.3 27.5 L4.7 22.3 Z"
    fill="var(--room-wood-hi,#E3B27B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <circle
    cx="10.0"
    cy="21.5"
    r="1"
    fill="var(--room-metal,#74553B)"/>

</svg>
