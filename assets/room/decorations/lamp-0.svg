<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: desk lamp
       Part of a 4-file rotation set (lamp-0/90/180/270.svg), added for
       consistency now that Rotate is available generally. All 4 files
       are IDENTICAL: shade, stem, and base are all round in plan, with
       no directional feature (like a cord or switch) drawn — there's
       nothing that would look different from another angle.
       Small cozy lamp prop. -->


  <!-- stem -->

  <path
    d="
      M32 39
      V25"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


  <!-- lampshade: narrow top, wide bottom -->

  <path
    d="
      M28 13
      Q32 11 36 13
      L44 29
      Q32 35 20 29
      Z"
    fill="var(--room-lamp,#F6C85F)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3.5"
    stroke-linejoin="round"/>


  <!-- shade opening -->

  <path
    d="
      M20 29
      Q32 35 44 29"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linecap="round"/>


  <!-- base -->

  <path
    d="
      M23 41
      Q32 37 41 41
      V46
      Q32 50 23 46
      Z"
    fill="var(--room-wood-hi,#C98B5B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="3"
    stroke-linejoin="round"/>

</svg>
