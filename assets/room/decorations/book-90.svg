<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-10.0 -10.0 23.6 26.4" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Nook room decoration asset: book, rotation 90
       Part of a 4-file rotation set — see book-0.svg's header comment.
       Pages/cover faces/top cover unchanged. Bookmark mirrored across
       x=1.8 (the book's own anchor point — see anchor:[1.8,4.3] in
       room.js's ITEM_CATALOG) from the rotation-0 file. -->


  <!-- lower book pages -->

  <polygon points="-7.2,3.6 3.6,9.0 10.8,5.4 0.0,-0.8"
    fill="var(--room-paper,#FFF4DD)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- left cover face -->

  <polygon points="-7.2,3.6 3.6,9.0 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-lo,#B96F55)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- right cover face -->

  <polygon points="10.8,5.4 3.6,9.0 3.6,6.4 10.8,2.8"
    fill="var(--room-book-side,#C77A60)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- top cover -->

  <polygon points="0.0,-2.6 10.8,2.8 3.6,6.4 -7.2,1.0"
    fill="var(--room-book-hi,#D98B6B)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="2"
    stroke-linejoin="round"/>


  <!-- bookmark, mirrored to the other side -->

  <polygon points="0.8,-1.2 -0.2,-0.7 -0.2,3.0 0.3,2.3 0.8,3.0"
    fill="var(--room-accent,#F6C85F)"/>


</svg>
