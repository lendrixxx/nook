       Low stool (default room anchor: 2.4, 0.77, 0)
       Authored at local grid origin (0,0,0); the runtime positions this
       with a translate to iso(worldGX, worldGY, worldGZ). Colors use the
       room design tokens (see index.html :root) so themes can recolor
       every decoration without editing this file. -->
