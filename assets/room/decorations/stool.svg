<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-8 -7 16 18">

  <!-- Nook room decoration asset: stool
       Small cozy wooden stool.
       Uses existing room wood tokens. -->


  <!-- left leg -->

  <polygon
    points="
      -4,2
      0,4
      0,8
      -4,6"
    fill="var(--room-wood-lo,#A96C46)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- right leg -->

  <polygon
    points="
      4,2
      0,4
      0,8
      4,6"
    fill="var(--room-wood,#B9784D)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- lower seat -->

  <path
    d="
      M0 -4
      L6 -1
      L6 0.5
      L0 3.5
      L-6 0.5
      L-6 -1
      Z"
    fill="var(--room-wood-hi,#D5A06A)"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.8"
    stroke-linejoin="round"/>


  <!-- seat front edge -->

  <path
    d="
      M-6 0.5
      Q0 3.5 6 0.5"
    fill="none"
    stroke="var(--room-outline,#74553B)"
    stroke-width="1.5"
    stroke-linecap="round"/>

</svg>